name: autopilot
description: >-
  Drive one feature slice to all-gates-green and an open MR: implement, then the
  gate stack in order (tests, test-health, lint, static-analysis, types, code-review
  to convergence, spec-coverage), then a human checkpoint before the MR. Absorbs the
  autopilot skill's native-mode loop (select→implement→gate→mark-done→finalize) as a
  conductor workflow. Never merges — hooks/block-merge.sh still governs.

inputs:
  feature:
    required: true
  test_cmd:
    required: true
  lint_cmd:
    required: true
  types_cmd:
    required: true

defaults:
  runner: { harness: claude, model: sonnet }

steps:
  - id: implement
    type: agent
    prompt: prompts/autopilot-implement.md
    # Implementation step is creative/probabilistic (autopilot SKILL.md's own
    # deterministic-vs-probabilistic split) — everything after this is a gate.

  - id: tests
    type: shell
    needs: [implement]
    run: "{{inputs.test_cmd}}"
    on_fail: { then: escalate }

  # DEFECT-1 (2026-07): an `agent` step must never own a bare pass/fail marker for "did
  # the work succeed" — a model that simply forgets to write it fails the run even when
  # the real work is fine, and a resume then RE-RUNS the step, redoing already-finished
  # work. test-health/static-analysis/spec-coverage below report their judgment
  # narratively instead; the deterministic shell gates around them (tests, lint, types)
  # plus the human open-mr-gate are the run's real success signal. Only a step whose
  # output is a genuine content artifact a later step actually consumes — code-review's
  # review.json, parsed by `loop_until` below — declares `artifacts`.
  - id: test-health
    type: agent
    needs: [tests]
    prompt: prompts/autopilot-test-health.md
    on_fail: { then: escalate }

  - id: lint
    type: shell
    needs: [test-health]
    run: "{{inputs.lint_cmd}}"
    on_fail: { then: escalate }

  - id: static-analysis
    type: agent
    needs: [lint]
    prompt: prompts/autopilot-static-analysis.md
    # No artifacts marker — see the DEFECT-1 comment above `test-health`. Findings are
    # reported narratively; `types` below and the human gate are the real signal.
    on_fail: { then: escalate }

  - id: types
    type: shell
    needs: [static-analysis]
    run: "{{inputs.types_cmd}}"
    on_fail: { then: escalate }

  - id: code-review
    type: agent
    needs: [types]
    prompt: prompts/autopilot-code-review.md
    artifacts: [.conductor/artifacts/review.json]
    # Review → fix convergence (gate-stack.md). max: 3 mirrors autopilot's
    # --max-review-rounds default — edit this copy directly if a run needs a
    # different cap; workflows are repo-owned, no reference drift.
    # DEFECT-2: `findings` must hold only OPEN items — a resolved finding left in the
    # array (even annotated "RESOLVED") keeps this count > 0 forever and never converges.
    loop_until:
      shell: >-
        test "$(node -pe "JSON.parse(require('fs').readFileSync('.conductor/artifacts/review.json')).findings.length")" -eq 0
      max: 3
    on_fail: { then: escalate }

  - id: spec-coverage
    type: agent
    needs: [code-review]
    prompt: prompts/autopilot-spec-coverage.md
    # No artifacts marker — see the DEFECT-1 comment above `test-health`. Gaps are
    # reported narratively; open-mr-gate below is the human's chance to catch them.
    on_fail: { then: escalate }

  - id: open-mr-gate
    type: gate
    needs: [spec-coverage]
    message: >-
      All gates green for {{inputs.feature}}. Approve MR creation? Conductor opens
      the MR; it never merges — a human merges out of band.

# The gate IS the approval (a rejection escalates and never reaches this step). Provider
# comes from ai-utilities.json's vcs.platform when the repo declares one, else the origin
# remote's HOSTNAME only (never the whole URL — a repo path containing "gitlab" or
# "github", e.g. a GitHub repo named gitlab-migration, must not misclassify); never
# guessed by falling through a failed glab call to gh (an unrelated glab auth/network
# failure must not open the wrong host's PR). An unrecognized host with no configured
# platform fails loudly. view-before-create makes a resume after a prior success a no-op
# instead of erroring or opening a duplicate. Conductor never merges.
  - id: mr
    type: shell
    needs: [open-mr-gate]
    run: |
      set -e
      git push -u origin HEAD
      origin_url="$(git remote get-url origin)"
      platform="$(node -pe "(() => { try { return JSON.parse(require('fs').readFileSync('ai-utilities.json')).vcs.platform || ''; } catch { return ''; } })()")"
      if [ -z "$platform" ]; then
        host="$origin_url"
        host="${host#*://}"
        host="${host#*@}"
        host="${host%%/*}"
        host="${host%%:*}"
        case "$host" in
          *gitlab*) platform=gitlab ;;
          *github*) platform=github ;;
        esac
      fi
      case "$platform" in
        gitlab) glab mr view >/dev/null 2>&1 || glab mr create --fill --yes ;;
        github) gh pr view >/dev/null 2>&1 || gh pr create --fill ;;
        *) echo "mr: cannot determine provider from origin \"$origin_url\" (expected a gitlab or github host, or vcs.platform in ai-utilities.json)" >&2; exit 1 ;;
      esac
