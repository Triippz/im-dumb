# Gate 4, full offline suite (warn-only). Does not block PRs.
name: eval-nightly

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate4-warn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify:golden
      - run: npm run verify:dist-sync
      - run: npm run eval:smoke
      - name: Live smoke (warn-only when enabled)
        if: vars.JUDGE_SMOKE_ENABLED == 'true'
        continue-on-error: true
        env:
          JUDGE_API_KEY: ${{ secrets.JUDGE_API_KEY }}
          JUDGE_MODEL: ${{ vars.JUDGE_MODEL }}
          JUDGE_MODEL_VERSION: ${{ vars.JUDGE_MODEL_VERSION }}
          GENERATOR_MODEL: ${{ vars.GENERATOR_MODEL }}
        run: |
          if [ -z "$JUDGE_API_KEY" ] || [ -z "$JUDGE_MODEL" ] || [ -z "$JUDGE_MODEL_VERSION" ]; then
            echo "JUDGE_SMOKE_ENABLED=true but judge pin/secret incomplete, warn only" >&2
            exit 1
          fi
          npm run eval:smoke:live
