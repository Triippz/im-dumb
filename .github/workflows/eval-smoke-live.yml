# Gate 2 live judge — path-filtered; blocks only when JUDGE_SMOKE_ENABLED=true.
name: eval-smoke-live

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'skill/**'
      - 'src/**'
      - 'eval/**'
      - 'package.json'
      - 'package-lock.json'
      - '.eval.env.example'
      - '.github/workflows/ci.yml'
      - '.github/workflows/eval-smoke-live.yml'
  push:
    branches: [main]
    paths:
      - 'skill/**'
      - 'src/**'
      - 'eval/**'
      - 'package.json'
      - 'package-lock.json'
      - '.eval.env.example'
      - '.github/workflows/ci.yml'
      - '.github/workflows/eval-smoke-live.yml'

permissions:
  contents: read

jobs:
  eval-smoke-live:
    if: vars.JUDGE_SMOKE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Layer 2 live smoke (pinned judge)
        env:
          JUDGE_API_KEY: ${{ secrets.JUDGE_API_KEY }}
          JUDGE_MODEL: ${{ vars.JUDGE_MODEL }}
          JUDGE_MODEL_VERSION: ${{ vars.JUDGE_MODEL_VERSION }}
          GENERATOR_MODEL: ${{ vars.GENERATOR_MODEL }}
        run: |
          if [ -z "$JUDGE_API_KEY" ] || [ -z "$JUDGE_MODEL" ] || [ -z "$JUDGE_MODEL_VERSION" ]; then
            echo "JUDGE_SMOKE_ENABLED=true but judge pin/secret incomplete" >&2
            exit 1
          fi
          npm run eval:smoke:live
