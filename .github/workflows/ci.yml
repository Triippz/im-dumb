name: ci

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24.x, 26.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify:golden
      - run: npm run verify:dist-sync
      - name: Layer 1 skill check from dependency-free sandbox
        run: |
          sandbox="$(mktemp -d)"
          run_dir="$(mktemp -d)"
          trap 'rm -rf "$sandbox" "$run_dir"' EXIT
          mkdir "$sandbox/dist"
          cp -R "${{ github.workspace }}/dist/." "$sandbox/dist/"
          printf '{"type":"module"}\n' > "$sandbox/package.json"
          test ! -e "$sandbox/node_modules"
          cd "$run_dir"
          test ! -e node_modules
          node "$sandbox/dist/check-cli.js" --file "${{ github.workspace }}/skill/im-dumb/SKILL.md" --skill-doc
